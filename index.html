<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francis Mbugua - Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .reveal { opacity: 0; transform: translateY(18px); transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.in-view { opacity: 1; transform: translateY(0); }
    .grid-pattern { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 32px 32px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #262629; border-radius: 999px; }
    ::-webkit-scrollbar-track { background: #0a0a0b; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>
  <script type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';

    // ===== IMAGE PATHS =====
    const IMG = {
      logo: 'image/logo.png',
      profile: 'image/profile.png',
      nexora: 'image/nexora.webp',
      fratience: 'image/Fratience.png',
      signix: 'image/signix.webp',
      johnDoe: 'image/testimonials/John Doe.webp',
      janeMuthoni: 'image/testimonials/Jane Muthoni.webp',
      patience: 'image/testimonials/Patience.png',
    };

    // ===== DATA =====
    const projects = [
      {
        id: 'nexora',
        title: 'Nexora Technologies',
        tag: 'Marketplace • Live',
        desc: 'Freelance marketplace connecting businesses, developers, startups and cybersecurity experts across Kenya. Discovery, trust, fast hiring.',
        tech: ['React', 'Node.js', 'Firebase', 'Tailwind'],
        img: IMG.nexora,
        live: 'https://francis297-web.github.io/nexora/',
        github: 'https://github.com/Francis297-web',
        gradient: 'from-violet-600/30 via-fuchsia-500/20 to-violet-900/20'
      },
      {
        id: 'fratience',
        title: 'Fratience Tech Solutions',
        tag: 'Platform • Live',
        desc: 'Practical tech for local businesses — inventory, bookings, M-Pesa integration, offline-first architecture for low-connectivity.',
        tech: ['Next.js', 'MongoDB', 'M-Pesa', 'Vercel'],
        img: IMG.fratience,
        live: 'https://project-3fsps-7jc9zubdm-fratience.vercel.app',
        github: 'https://github.com/Francis297-web',
        gradient: 'from-emerald-500/25 via-teal-500/20 to-emerald-900/20'
      },
      {
        id: 'signix',
        title: 'Signix — KSL Web School',
        tag: 'EdTech • AI • Live',
        desc: 'Sign language education for the deaf — KSL dictionary, creator tools, and AI tutor that understands Kenyan Sign Language.',
        tech: ['React', 'AI', 'PWA', 'Firebase'],
        img: IMG.signix,
        live: 'https://signi-6s5o2gddf-fratience.vercel.app',
        github: 'https://github.com/Francis297-web',
        gradient: 'from-blue-600/30 via-sky-500/15 to-indigo-900/20'
      }
    ];

    const testimonials = [
      {
        name: 'John Doe',
        role: 'CEO, Tech Startup',
        img: IMG.johnDoe,
        quote: 'Francis is an exceptional developer with great attention to detail. His work on Nexora was outstanding — clean architecture and shipped on time.'
      },
      {
        name: 'Jane Muthoni',
        role: 'Product Manager, Nairobi',
        img: IMG.janeMuthoni,
        quote: 'Collaborated on multiple products. He moves fast, writes maintainable code, and actually solves business problems, not just tickets.'
      },
      {
        name: 'Patience Wambui',
        role: 'Founder & CEO, Signix',
        img: IMG.patience,
        quote: 'A true professional who delivers quality code and meets deadlines. Highly recommended for any serious web project from Kenya to global.'
      }
    ];

    // ===== APP =====
    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('home');
      const [toast, setToast] = useState(null);
      const [navTick, setNavTick] = useState(0);
      const sectionRefs = useRef([]);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              const section = entry.target.getAttribute('data-section');
              if (section) setActiveSection(section);
            }
          });
        }, { threshold: 0.2 });

        sectionRefs.current.forEach(el => {
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      const navigateTo = (section, btn) => {
        if (btn) {
          btn.setAttribute('data-clicked', Date.now().toString());
          btn.setAttribute('data-nav-tick', (navTick + 1).toString());
        }
        setMenuOpen(false);
        setActiveSection(section);
        setNavTick(prev => prev + 1);

        const el = document.getElementById(section);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (section === 'home') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        try { window.location.hash = section; } catch (e) {}
        showToast(`→ ${section.charAt(0).toUpperCase() + section.slice(1)} · ${navTick + 1}`);
      };

      return (
        <div className="min-h-screen bg-[#0a0a0b] text-white selection:bg-violet-500/30 antialiased overflow-x-hidden">
          {/* Toast */}
          <div
            data-testid="nav-toast"
            data-tick={navTick}
            className={`fixed top-20 left-1/2 -translate-x-1/2 z-[100] bg-white text-black px-5 py-2.5 rounded-full text-[13px] font-semibold shadow-2xl transition-all duration-300 ${
              toast ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'
            }`}
          >
            {toast || 'Ready'}
          </div>

          {/* Navbar */}
          <nav className="sticky top-0 z-50 backdrop-blur-xl bg-[#0a0a0b]/80 border-b border-[#1a1a1e]">
            <div className="max-w-[1280px] mx-auto px-5 md:px-8 h-[72px] flex items-center justify-between gap-4">
              <button onClick={(e) => navigateTo('home', e.currentTarget)} className="flex items-center gap-2.5 font-bold tracking-tight shrink-0">
                <img src={IMG.logo} alt="logo" className="w-7 h-7 rounded-[8px] object-cover" />
                <span className="text-[16px]">Francis</span>
                <span className="text-violet-400">.</span>
              </button>

              <div className="hidden md:flex items-center gap-1 text-[13.5px] text-zinc-400">
                {['Home', 'About', 'Skills', 'Projects', 'Contact'].map((label) => {
                  const id = label.toLowerCase();
                  return (
                    <button key={id} onClick={(e) => navigateTo(id, e.currentTarget)} className={`px-3.5 py-2 rounded-full transition ${activeSection === id ? 'bg-[#1c1c20] text-white' : 'hover:text-white hover:bg-[#151518]'}`}>
                      {label}
                    </button>
                  );
                })}
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => showToast('CV download started')} className="hidden md:inline-flex h-8 px-3.5 rounded-full border border-[#262629] bg-[#151518] text-[13px] font-medium items-center gap-1.5 hover:border-zinc-600 transition">
                  <span className="text-[11px]">↗</span> CV
                </button>
                <a href="https://wa.me/254790357975" target="_blank" rel="noreferrer" className="hidden md:inline-flex h-8 px-4 rounded-full bg-white text-black text-[13px] font-semibold items-center gap-1.5 hover:bg-zinc-100 transition">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#06ffa5] animate-pulse"></span> Hire Me
                </a>
                <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden w-9 h-9 grid place-items-center rounded-full border border-[#262629] bg-[#151518]">
                  <div className="w-4 h-3 flex flex-col justify-between">
                    <span className={`h-0.5 bg-white transition ${menuOpen ? 'rotate-45 translate-y-[5px]' : ''}`}></span>
                    <span className={`h-0.5 bg-white transition ${menuOpen ? 'opacity-0' : ''}`}></span>
                    <span className={`h-0.5 bg-white transition ${menuOpen ? '-rotate-45 -translate-y-[5px]' : ''}`}></span>
                  </div>
                </button>
              </div>
            </div>

            {/* Mobile Menu */}
            {menuOpen && (
              <div className="md:hidden border-t border-[#1e1e20] bg-[#0a0a0b] px-5 py-5 space-y-3">
                {['Home', 'About', 'Skills', 'Projects', 'Contact'].map((label) => {
                  const id = label.toLowerCase();
                  return (
                    <button key={id} onClick={() => navigateTo(id)} className={`block w-full text-left py-2.5 px-3 rounded-xl text-[14px] ${activeSection === id ? 'bg-[#1e1e20] text-white' : 'text-zinc-400'}`}>
                      {label}
                    </button>
                  );
                })}
                <div className="flex gap-2 pt-2">
                  <a href="https://wa.me/254790357975" target="_blank" className="flex-1 h-11 rounded-full bg-white text-black grid place-items-center font-semibold text-sm">WhatsApp</a>
                  <button onClick={() => showToast('CV download started')} className="flex-1 h-11 rounded-full border border-[#262629] grid place-items-center text-sm">Download CV</button>
                </div>
              </div>
            )}
          </nav>

          {/* Home */}
          <section id="home" data-section="home" ref={el => sectionRefs.current[0] = el} className="reveal relative overflow-hidden">
            <div className="absolute inset-0 grid-pattern opacity-60"></div>
            <div className="absolute -top-[30%] left-1/2 -translate-x-1/2 w-[80vw] max-w-[900px] h-[520px] rounded-full blur-[100px] bg-[radial-gradient(ellipse_at_center,rgba(124,58,237,0.18),transparent_60%)]"></div>
            <div className="relative max-w-[1280px] mx-auto px-5 md:px-8 py-12 md:py-20 lg:py-24 grid lg:grid-cols-[1.1fr_0.9fr] gap-10 items-center">
              <div className="min-w-0">
                <div className="inline-flex items-center gap-2 h-7 px-3 rounded-full border border-[#262629] bg-[#151518]/80 text-[11px] text-zinc-300 mono">
                  <span className="w-2 h-2 rounded-full bg-[#06ffa5] animate-pulse shadow-[0_0_10px_rgba(6,255,165,.6)]"></span>
                  Available for freelance • Founder @ Nexora • Nairobi, KE
                </div>
                <h1 className="mt-6 text-[34px] sm:text-[44px] md:text-[54px] font-extrabold leading-[0.92] tracking-[-0.04em]">
                  Full Stack<br />
                  <span className="bg-gradient-to-r from-white via-white to-zinc-500 bg-clip-text text-transparent">Developer</span>
                  <span className="block mt-2 text-[26px] sm:text-[32px] md:text-[38px] font-medium tracking-[-0.03em] text-zinc-400">
                    building products <span className="text-white relative inline-flex">that scale<span className="absolute -bottom-1 left-0 right-0 h-[3px] bg-gradient-to-r from-violet-500 to-[#06ffa5] rounded-full"></span></span>
                  </span>
                </h1>
                <p className="mt-5 max-w-[540px] text-[14.5px] sm:text-[15.5px] leading-[1.75] text-zinc-400">
                  I'm <span className="text-white font-medium">Francis Mbugua Chege</span>, founder of Nexora Technologies. I build modern websites, Android apps, and cybersecurity tools from Kenya — focused on real problems, clean systems, and shipping fast.
                </p>
                <div className="mt-7 flex flex-wrap gap-3">
                  <button onClick={() => navigateTo('projects')} className="h-11 px-6 rounded-full bg-white text-black font-semibold text-[14px] inline-flex items-center gap-2 hover:bg-zinc-100 transition">View Projects <span>↗</span></button>
                  <button onClick={() => navigateTo('contact')} className="h-11 px-6 rounded-full border border-[#262629] bg-[#151518] text-white font-medium text-[14px] inline-flex items-center gap-2 hover:border-zinc-500 transition">Hire Me <span className="opacity-60">✦</span></button>
                </div>
                <div className="mt-10 grid grid-cols-3 max-w-[420px] border-t border-[#1e1e20] pt-6">
                  {[['3+ yrs', 'Experience'], ['15+ Projects', 'Shipped'], ['100%', 'On Time']].map(([val, label]) => (
                    <div key={label} className="border-r last:border-0 border-[#1e1e20] px-2 first:pl-0">
                      <div className="text-[20px] font-bold tracking-tight leading-none">{val}</div>
                      <div className="mt-1.5 text-[10.5px] text-zinc-500 mono uppercase tracking-widest">{label}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="relative flex justify-center lg:justify-end">
                <div className="relative w-full max-w-[380px] rounded-[28px] border border-[#262629] bg-[#151518] p-2.5 shadow-[0_20px_80px_rgba(0,0,0,.5)]">
                  <div className="relative rounded-[20px] overflow-hidden bg-[#0a0a0b] aspect-[0.9]">
                    <img src={IMG.profile} alt="Francis Mbugua" className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0b] via-transparent to-transparent"></div>
                    <div className="absolute bottom-0 inset-x-0 p-4 flex items-end justify-between">
                      <div className="backdrop-blur-xl bg-black/50 border border-white/10 rounded-2xl px-4 py-2.5">
                        <div className="text-[13px] font-semibold leading-none">Francis Mbugua</div>
                        <div className="text-[11px] mono text-zinc-400 mt-1">Full Stack • Founder</div>
                      </div>
                      <div className="w-9 h-9 rounded-full bg-[#06ffa5] grid place-items-center text-black text-[14px] shadow-[0_0_20px_rgba(6,255,165,.5)]">✦</div>
                    </div>
                  </div>
                  <div className="absolute -top-2 -right-2 md:-right-4 bg-[#151518] border border-cyan-500/20 text-cyan-300 px-3 py-1.5 rounded-full text-[11px] mono flex items-center gap-1.5 shadow-xl">
                    <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span> React
                  </div>
                  <div className="absolute top-[45%] -left-3 md:-left-6 bg-[#151518] border border-green-500/20 text-green-300 px-3 py-1.5 rounded-full text-[11px] mono flex items-center gap-1.5 shadow-xl">
                    <span className="w-1.5 h-1.5 rounded-full bg-current"></span> Node.js
                  </div>
                  <div className="absolute -bottom-3 right-6 bg-white text-black px-3 py-1.5 rounded-full text-[11px] mono font-semibold shadow-xl">Rust • Security</div>
                </div>
              </div>
            </div>
          </section>

          {/* About */}
          <section id="about" data-section="about" ref={el => sectionRefs.current[1] = el} className="reveal border-t border-[#151518] bg-[#0a0a0b] py-20 md:py-28">
            <div className="max-w-[1280px] mx-auto px-5 md:px-8">
              <div className="flex flex-wrap items-end justify-between gap-6">
                <div className="max-w-[560px]">
                  <div className="mono text-[11px] tracking-[0.2em] uppercase text-zinc-500">Featured Work • 2023—2026</div>
                  <h2 className="mt-3 text-[32px] md:text-[40px] font-bold leading-[1.05] tracking-[-0.03em]">Building software that solves real problems.</h2>
                  <p className="mt-4 text-[15px] leading-[1.7] text-zinc-400">I work across the stack — interface to infrastructure — on web, mobile and security. Founder mindset, engineer execution.</p>
                </div>
                <button onClick={() => navigateTo('projects')} className="mono text-[12px] tracking-widest uppercase text-zinc-400 hover:text-white inline-flex items-center gap-2 border border-[#262629] rounded-full px-4 h-9">See all projects ↗</button>
              </div>
              <div className="mt-12 grid md:grid-cols-3 gap-5">
                {projects.map(p => (
                  <a key={p.id} href={p.live} target="_blank" rel="noreferrer" className="group relative rounded-[20px] border border-[#262629] bg-[#151518] overflow-hidden hover:border-zinc-600 transition-all duration-300 hover:-translate-y-1">
                    <div className="relative h-[200px] overflow-hidden bg-[#0a0a0b]">
                      <div className={`absolute inset-0 bg-gradient-to-br ${p.gradient} opacity-60 group-hover:opacity-80 transition`}></div>
                      <img src={p.img} alt={p.title} className="relative w-full h-full object-cover mix-blend-luminosity group-hover:mix-blend-normal group-hover:scale-[1.02] transition duration-500" />
                      <div className="absolute top-3 left-3 flex gap-2">
                        <span className="h-6 px-2.5 rounded-full bg-black/60 border border-white/10 backdrop-blur text-[10px] font-medium mono text-zinc-200 grid place-items-center">{p.tag}</span>
                      </div>
                      <div className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white text-black grid place-items-center opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 transition">↗</div>
                    </div>
                    <div className="p-5">
                      <h3 className="text-[16px] font-semibold">{p.title}</h3>
                      <p className="mt-2 text-[13px] leading-[1.6] text-zinc-400 line-clamp-2">{p.desc}</p>
                      <div className="mt-4 flex flex-wrap gap-1.5">
                        {p.tech.map(t => <span key={t} className="h-6 px-2.5 rounded-full bg-[#0a0a0b] border border-[#262629] text-[11px] text-zinc-400 mono">{t}</span>)}
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </section>

          {/* Why Work + Skills */}
          <section className="border-y border-[#151518] bg-[#0f0f10]">
            <div className="max-w-[1280px] mx-auto px-5 md:px-8 py-20 md:py-28 grid lg:grid-cols-[0.95fr_1.05fr] gap-12 items-center">
              <div ref={el => sectionRefs.current[2] = el} className="reveal">
                <div className="inline-flex items-center gap-2 text-[11px] mono tracking-[0.2em] uppercase text-zinc-500 border border-[#262629] rounded-full px-3 h-7">Why Work With Me</div>
                <h2 className="mt-5 text-[30px] md:text-[38px] font-bold tracking-[-0.03em] leading-[1.05]">Clean systems.<br />Fast shipping.<br /><span className="text-zinc-500">No surprises.</span></h2>
                <p className="mt-4 text-[15px] leading-[1.7] text-zinc-400 max-w-[460px]">I care about code that lasts and products that actually work for the people using them — not just what looks good in a demo.</p>
                <div className="mt-8 grid sm:grid-cols-2 gap-3">
                  {[
                    { icon: '{}', title: 'Clean Code', desc: 'Readable, well-structured, easy to extend.' },
                    { icon: '⚡', title: 'Fast Delivery', desc: 'Clear timelines and steady progress.' },
                    { icon: '💬', title: 'Responsive Support', desc: 'Reachable on WhatsApp & email.' },
                    { icon: '🛡️', title: 'Security-Minded', desc: 'Protection, secure practices day one.' }
                  ].map(item => (
                    <div key={item.title} className="rounded-[16px] border border-[#262629] bg-[#151518] p-4 hover:border-zinc-600 transition group">
                      <div className="w-9 h-9 rounded-[10px] bg-white text-black grid place-items-center group-hover:scale-105 transition text-[14px] font-bold">{item.icon}</div>
                      <div className="mt-3 text-[14px] font-semibold">{item.title}</div>
                      <div className="mt-1 text-[13px] leading-[1.5] text-zinc-400">{item.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div id="skills" data-section="skills" ref={el => sectionRefs.current[3] = el} className="reveal">
                <div className="rounded-[24px] border border-[#262629] bg-[#151518] p-6 md:p-7">
                  <div className="mono text-[11px] tracking-widest uppercase text-zinc-500">Stack • Tools • Timeline</div>
                  <h3 className="mt-3 text-[22px] font-bold tracking-tight">Full stack, from pixel to production.</h3>
                  <div className="mt-8 space-y-6">
                    {[
                      { group: 'Frontend', items: ['HTML5', 'CSS3', 'JavaScript', 'React', 'Tailwind', 'Next.js'] },
                      { group: 'Backend', items: ['Node.js', 'Express', 'Firebase', 'REST', 'WebSockets'] },
                      { group: 'Tools', items: ['Git', 'Linux', 'Vercel', 'Figma', 'Postman'] },
                      { group: 'Systems', items: ['Rust', 'WASM', 'Security', 'Performance'] }
                    ].map(skill => (
                      <div key={skill.group} className="flex gap-4 flex-wrap md:flex-nowrap">
                        <div className="w-[80px] shrink-0 pt-1 text-[11px] mono uppercase tracking-widest text-zinc-500">{skill.group}</div>
                        <div className="flex flex-wrap gap-2">
                          {skill.items.map(item => (
                            <span key={item} className="h-7 px-3 rounded-full border border-[#262629] bg-[#0a0a0b] text-[12px] text-zinc-300 grid place-items-center hover:border-zinc-600 hover:text-white transition">{item}</span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-8 pt-6 border-t border-[#262629]">
                    <div className="mono text-[11px] uppercase tracking-widest text-zinc-500 mb-4">Experience Timeline</div>
                    <div className="relative pl-6 border-l border-[#262629] space-y-7">
                      {[
                        { year: '2025 — Present', role: 'Founder, Nexora Technologies', desc: 'Leading freelance marketplace. 15+ devs, 40+ businesses onboarded.' },
                        { year: '2024 — 2025', role: 'Full Stack Developer, Freelance', desc: 'Built Fratience, Signix and client products. Performance & security focus.' },
                        { year: '2023', role: 'Started building in public', desc: 'Shipped first production apps with Firebase and React. Learning Rust.' }
                      ].map(exp => (
                        <div key={exp.year} className="relative">
                          <div className="absolute -left-[29px] top-1 w-3 h-3 rounded-full bg-white shadow-[0_0_0_4px_#151518]"></div>
                          <div className="text-[11px] mono text-zinc-500">{exp.year}</div>
                          <div className="mt-1 text-[13.5px] font-semibold">{exp.role}</div>
                          <div className="mt-1 text-[12.5px] leading-[1.6] text-zinc-400">{exp.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Projects Detail */}
          <section id="projects" data-section="projects" ref={el => sectionRefs.current[4] = el} className="reveal bg-[#0a0a0b] py-20 md:py-28">
            <div className="max-w-[1280px] mx-auto px-5 md:px-8">
              <div className="flex items-end justify-between gap-6">
                <div>
                  <div className="mono text-[11px] tracking-[0.2em] uppercase text-zinc-500">Selected Work • Deep Dive</div>
                  <h2 className="mt-3 text-[30px] md:text-[40px] font-bold tracking-[-0.03em]">Products that shipped.</h2>
                </div>
                <div className="hidden md:block text-[13px] text-zinc-500 mono max-w-[300px] leading-[1.6]">Each project focused on real users, fast loads, and maintainable code.</div>
              </div>
              <div className="mt-10 space-y-5">
                {projects.map(p => (

      return (
        <div className="mt-6 grid gap-4">

          <div className="flex flex-wrap gap-3">
