<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francis Chege-personal portfolio</title>
    
    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- Your custom animations -->
    <link rel="stylesheet" href="Animation.css" />
    <!-- Main pro styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container animate__animated animate__fadeIn">
        <header class="header animate__animated animate__fadeInDown">
            <div class="logo">SIGNiX<span>AI</span></div>
            <div class="status-badge">● System Live</div>
        </header>

        <main class="card animate__animated animate__fadeInUp">
            <h1>Generate & Sign with AI</h1>
            <p class="subtitle">AI drafts the contract, SIGNiX handles the signature.</p>
            
            <textarea id="prompt" placeholder="e.g. Draft a Mutual NDA between Acme Kenya and Fraky Spikes for an AI project..."></textarea>
            
            <button id="generateBtn" class="btn-primary">
                <span>Generate Document</span>
                <div class="btn-shine"></div>
            </button>

            <div id="result" class="result-box hidden"></div>
        </main>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateBtn');
            const result = document.getElementById('result');
            btn.innerHTML = 'Processing...';
            btn.disabled = true;

            result.classList.remove('hidden');
            result.classList.add('animate__animated', 'animate__fadeIn');
            result.innerText = 'AI is drafting, then sending to SIGNiX...';

            // Call your Python backend
            // fetch('/api/generate', { method: 'POST', ... })
        });
    </script>
</body>
</html>
